<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <defs>
    <linearGradient id="eggShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cartonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="itemShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#itemShadow)">
    <!-- Egg Carton Base -->
    <path d="M 25 110 L 35 165 C 36 172 42 176 50 176 L 110 176 C 118 176 124 172 125 165 L 135 110 Z" fill="url(#cartonGrad)"/>
    <path d="M 22 108 L 138 108 L 135 115 L 25 115 Z" fill="#475569"/>

    <!-- Front Eggs -->
    <!-- Egg 1 Left -->
    <ellipse cx="50" cy="100" rx="18" ry="24" fill="url(#eggShell)"/>
    <ellipse cx="46" cy="94" rx="4" ry="8" fill="#FFFFFF" opacity="0.6"/>

    <!-- Egg 2 Center -->
    <ellipse cx="80" cy="96" rx="20" ry="26" fill="url(#eggShell)"/>
    <ellipse cx="76" cy="90" rx="5" ry="9" fill="#FFFFFF" opacity="0.7"/>

    <!-- Egg 3 Right -->
    <ellipse cx="110" cy="100" rx="18" ry="24" fill="url(#eggShell)"/>
    <ellipse cx="106" cy="94" rx="4" ry="8" fill="#FFFFFF" opacity="0.6"/>

    <!-- Carton Texture & Ridges -->
    <rect x="48" y="125" width="4" height="40" rx="2" fill="#475569" opacity="0.5"/>
    <rect x="78" y="125" width="4" height="40" rx="2" fill="#475569" opacity="0.5"/>
    <rect x="108" y="125" width="4" height="40" rx="2" fill="#475569" opacity="0.5"/>
  </g>
</svg>
