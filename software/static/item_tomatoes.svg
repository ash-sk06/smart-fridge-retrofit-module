<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tomatoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="itemShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#itemShadow)">
    <!-- Tomato Body -->
    <ellipse cx="80" cy="115" rx="42" ry="38" fill="url(#tomatoRed)"/>

    <!-- Shiny Glaze Highlight -->
    <path d="M 55 95 C 60 85 75 85 85 88" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="94" cy="92" r="3" fill="#FFFFFF" opacity="0.6"/>

    <!-- Stem Base -->
    <ellipse cx="80" cy="80" rx="8" ry="4" fill="#15803D"/>
    <!-- Stem Leaves (Calyx) -->
    <path d="M 80 80 Q 65 70 60 62 Q 72 74 80 78" fill="url(#leafGreen)"/>
    <path d="M 80 80 Q 95 70 100 62 Q 88 74 80 78" fill="url(#leafGreen)"/>
    <path d="M 80 80 Q 75 60 80 50 Q 85 62 80 78" fill="url(#leafGreen)"/>
    <path d="M 80 80 Q 55 85 48 85 Q 64 82 80 80" fill="url(#leafGreen)"/>
    <path d="M 80 80 Q 105 85 112 85 Q 96 82 80 80" fill="url(#leafGreen)"/>
  </g>
</svg>
