<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <defs>
    <linearGradient id="appleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="30%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="appleLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <filter id="itemShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#itemShadow)">
    <!-- Apple Body -->
    <path d="M 80 80 C 65 65 40 75 40 105 C 40 135 60 165 80 165 C 100 165 120 135 120 105 C 120 75 95 65 80 80 Z" fill="url(#appleRed)"/>

    <!-- Apple Highlight -->
    <path d="M 52 90 C 52 80 62 76 72 78" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Stem -->
    <path d="M 80 80 Q 84 65 90 55" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Green Leaf -->
    <path d="M 86 64 Q 102 54 108 62 Q 98 74 86 64 Z" fill="url(#appleLeaf)"/>
  </g>
</svg>
