<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="100%" height="100%">
  <defs>
    <linearGradient id="milkCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="itemShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <g filter="url(#itemShadow)">
    <!-- Cap -->
    <rect x="65" y="16" width="30" height="14" rx="4" fill="url(#milkCap)"/>
    <rect x="68" y="14" width="24" height="4" rx="2" fill="#93C5FD"/>

    <!-- Neck -->
    <path d="M 68 30 L 68 45 L 45 65 L 45 170 C 45 178 51 184 60 184 L 100 184 C 109 184 115 178 115 170 L 115 65 L 92 30 Z" fill="url(#bottleGrad)"/>

    <!-- Glass Bottle Outline & Inner Glow -->
    <path d="M 68 30 L 68 45 L 45 65 L 45 170 C 45 178 51 184 60 184 L 100 184 C 109 184 115 178 115 170 L 115 65 L 92 30 Z" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Milk Liquid Core -->
    <path d="M 48 78 L 112 78 L 112 168 C 112 174 107 180 100 180 L 60 180 C 53 180 48 174 48 168 Z" fill="url(#liquidGrad)"/>

    <!-- Label -->
    <rect x="52" y="100" width="56" height="44" rx="6" fill="#3B82F6" fill-opacity="0.12"/>
    <rect x="52" y="100" width="56" height="44" rx="6" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Milk Cow / Fresh emblem -->
    <circle cx="80" cy="116" r="8" fill="#3B82F6"/>
    <path d="M 77 116 Q 80 113 83 116" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <text x="80" y="134" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="0.5">MILK</text>

    <!-- Reflection highlight on left edge -->
    <path d="M 52 70 L 52 170" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
